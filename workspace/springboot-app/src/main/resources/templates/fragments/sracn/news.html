<section id="news" th:fragment="news" class="relative py-24 px-6 overflow-hidden">
	<!-- Background image -->
	<img th:src="@{/images/public/sracn/pool-dark.jpg}" alt="Actualités du club"
		class="absolute inset-0 h-full w-full object-cover">

	<!-- Overlay -->
	<div class="absolute inset-0 bg-black/50"></div>

	<!-- Content-->
	<div class="relative z-10 max-w-6xl mx-auto">
		<div class="max-w-2xl">
			<h2 class="text-3xl md:text-4xl font-bold text-white">
				Actualités du club
			</h2>
			<p class="mt-2 text-white/70">
				Compétitions, événements, résultats et vie du club.
			</p>
		</div>
		<div class="mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
			<div th:replace="~{fragments/sracn/components/news-card :: card(
		        'Assemblée générale',
		        'Vie du club',
		        'L\'assemblée générale annuelle aura lieu le samedi 27 juin à la piscine de Legé. Elle sera suivie de la traditionnelle compétition interne.',
		        '26 mai 2026',
		        '/images/public/sracn/news/AG.jpg'
		      )}"></div>
			<div th:replace="~{fragments/sracn/components/news-card :: card(
			        'Stage intensif pendant les vacances',
			        'Club',
			        'Une semaine d’entraînement renforcé pour tous les groupes.',
			        '3 mai 2026',
			        '/images/public/sracn/news/entrainement.jpeg'
			      )}"></div>
			<div th:replace="~{fragments/sracn/components/news-card :: card(
			        'Belle performance aux championnats régionaux',
			        'Compétition',
			        'Nos nageurs reviennent avec plusieurs podiums.',
			        '12 mai 2026',
			        '/images/public/sracn/news/competition.jpg'
			      )}"></div>
		</div>
	</div>
</section>
