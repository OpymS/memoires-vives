<div th:fragment="card(title, category, excerpt, date, image)">
	<article class="group rounded-2xl overflow-hidden border border-gray-100 shadow-sm
                  hover:shadow-md hover:-translate-y-0.5
                  transition-all duration-300">

		<!-- IMAGE -->
		<div class="h-48 overflow-hidden">
			<img th:src="${image}" class="w-full h-full object-cover
                  group-hover:scale-105 transition-transform duration-500" alt="">
		</div>

		<!-- CONTENT -->
		<div class="p-5">
			<div class="text-xs font-semibold text-(--color-sracn-primary)
                  uppercase tracking-wide">
				<span th:text="${category}">Catégorie</span>
			</div>
			<h3 class="mt-2 text-lg font-bold text-(--color-sracn-text)
                 leading-snug line-clamp-2" th:text="${title}">
				Titre
			</h3>
			<p class="mt-2 text-sm text-(--color-sracn-muted)" th:text="${excerpt}">
				Extrait
			</p>
			<div class="mt-4 text-xs text-gray-400" th:text="${date}">
				Date
			</div>
		</div>
	</article>
</div>
