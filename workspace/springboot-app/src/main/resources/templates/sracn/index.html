<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>SRACN - Club de natation</title>

	<link rel="stylesheet" th:href="@{/css/sracn.build.tailwind.css}">
</head>

<body class="bg-(--color-sracn-bg) text-(--color-sracn-text) antialiased">

	<div th:replace="~{fragments/sracn/header :: header}"></div>

	<main>

		<div th:replace="~{fragments/sracn/hero :: hero}"></div>

		<div th:replace="~{fragments/sracn/pillars :: pillars}"></div>

		<div th:replace="~{fragments/sracn/groups :: groups}"></div>

		<div th:replace="~{fragments/sracn/news :: news}"></div>
		
		<div th:replace="~{fragments/sracn/practical-info :: practicalInfo}"></div>

		<div th:replace="~{fragments/sracn/sponsors :: sponsors}"></div>

	</main>
	<div th:replace="~{fragments/sracn/components/group-modal :: modal}"></div>
	<div th:replace="~{fragments/sracn/footer :: footer}"></div>

	<script src="/js/sracn/groups-modal.js"></script>
</body>

</html>
