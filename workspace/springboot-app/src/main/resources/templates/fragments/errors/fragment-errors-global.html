<!-- Affichage d'un message global s'il y a des erreurs -->
<div xmlns:th="http://www.thymeleaf.org" data-th-fragment="frag-errors"
	class="px-4 py-3 rounded-md bg-red-50 border-2 border-red-400 text-red-700" role="alert" data-th-if="${#fields.hasErrors('*')}">
	<h2 class="font-semibold">Veuillez vérifier vos champs</h2>
	<ul class="list-disc list-inside">
		<li th:each="err: ${#fields.globalErrors()}" th:text="${err}"></li>
	</ul>
</div>
