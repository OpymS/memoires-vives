<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/fragment-head :: head(
	${memoryForm.memoryId == 0 ? 'Nouveau souvenir' : 'Modification d’un souvenir'}+' | Mémoires vives',
	${memoryForm.memoryId == 0 ? 'Création d’un nouveau souvenir' : 'Modification d’un souvenir'},
	'noindex, nofollow',
	'',
	~{fragments/fragment-extra-head::memoryHead}
)}">
</head>

<body class="min-h-screen flex flex-col bg-paper">
	<div th:replace="~{fragments/fragment-header :: header}"></div>

	<main class="w-full flex-grow flex flex-col items-center">
		<h1 class="h1-title"
			th:text="${memoryForm.memoryId == 0 ? 'Partager un nouveau souvenir' : 'Modifier un souvenir'}"></h1>
		<form th:action="${memoryForm.memoryId == 0} ? @{/memory/new} : @{/memory/modify}" method="POST"
			th:object="${memoryForm}" enctype="multipart/form-data" id="formWithImage"
			class="w-full max-w-lg flex flex-col gap-6 mt-4">
			<div th:replace="~{fragments/errors/fragment-errors-global::frag-errors}"></div>
			<div class="inputs-container flex flex-col gap-5">
				<div class="title-input">
					<label for="title" class="form-label">Titre </label>
					<input id="title" th:field="*{title}" type="text" placeholder="Donnez un titre à votre souvenir"
						class="form-input" />
					<div th:replace="~{fragments/errors/fragment-error :: frag-error(title)}"></div>
				</div>
				<div class="description-input">
					<label for="description" class="form-label">Description </label>
					<textarea id="description" th:field="*{description}"
						placeholder="Décrivez précisément votre souvenir" class="form-input h-50"></textarea>
				</div>
				<div class="category-input">
					<label for="category" class="form-label">Catégorie </label>
					<select id="category" name="category" th:field="*{categoryId}" class="form-input">
						<option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}">
						</option>
					</select>
				</div>
				<div class="date-input">
					<label for="date" class="form-label">Date </label>
					<input id="date" th:field="*{memoryDate}" type="date" class="form-input" />
					<div th:replace="~{fragments/errors/fragment-error :: frag-error(memoryDate)}"></div>
				</div>
				<!--				<div class="visibility-input">-->
				<!--					<label for="visibility">Visibilité </label>-->
				<!--					<select id="visibility" name="visibility" th:field="*{visibility}">-->
				<!--						<option th:each="visibility : ${visibilities}" th:value="${visibility}" th:text="${visibility}">-->
				<!--						</option>-->
				<!--					</select>-->
				<!--				</div>-->
				<div class="source-input">
					<label for="source" class="form-label">Sources </label>
					<div class="flex w-full gap-2">
						<input id="source-input" type="text" class="form-input" />
						<button id="addSourceBtn" type="button" class="form-button">Ajouter</button>
					</div>
					<div id="sources-container" class="flex flex-wrap gap-2 mt-3">
						<div th:replace="~{fragments/errors/fragment-error :: frag-error('sources')}">
						</div>
						<div th:each="source, stat : *{sources}"
							th:class="'source-item flex items-center gap-2 px-3 py-1 rounded-full text-sm shadow-sm ' + ${source.statusClass}">
							<img class="w-4 h-4"
								th:src="'https://www.google.com/s2/favicons?sz=32&domain=' + ${source.domain}" />
							<a th:text="${source.domain}" th:href="${source.url}" target="_blank"
								rel="noopener noreferrer nofollow" class="source-tag font-medium">Source</a>
							<button type="button" aria-label="Retirer cette source" class="remove-source ml-1 text-ink-soft hover:text-red-600 transition
								focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink rounded">✕</button>
							<input type="hidden" th:name="'sources[' + ${stat.index} + '].url'"
								th:value="${source.url}">
							<div
								th:replace="~{fragments/errors/fragment-error :: frag-error('sources[' + ${stat.index} + '].url')}">
							</div>
						</div>
					</div>
				</div>
				<div class="image-input flex flex-col items-start w-auto gap-2">
					<span class="form-label">Choisir l'image associée</span>
					<div class="flex items-center gap-3">
						<label for="imageInput"
							class="cursor-pointer min-w-[80px] min-h-[80px] w-1/6 h-1/6 max-w-3xs max-h-[256px] shrink-0 inline-block relative aspect-square
							focus-within:ring-3 focus-within:ring-offset-2 focus-within:ring-offset-paper focus-within:ring-ink rounded-full">
							<img id="image" class="rounded-full w-full h-full object-cover border-2 border-olive"
								data-placeholder="/images/public/memory-placeholder.png"
								th:src="${#strings.isEmpty(memoryForm.mediaUUID)} ? @{/images/public/memory-placeholder.svg} : @{/uploads/{filename}(filename=${memoryForm.mediaUUID})}"
								th:alt="${#strings.isEmpty(memoryForm.mediaUUID)} ? 'souvenir sans image' : 'image associée au souvenir ' + ${memoryForm.title}" />
							<input id="imageInput" name="image" type="file" accept="image/png, image/jpeg"
								class="sr-only" />
						</label>
						<button type="button" id="removeImageBtn"
							class="p-2 rounded-full cursor-pointer hover:bg-sage-soft focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-olive"
							th:classappend="${#strings.isEmpty(memoryForm.mediaUUID)} ? ' hidden' : ''"
							title="Supprimer l'image">
							<img src="/images/public/trash.png" class="w-5 h-5 opacity-70 hover:opacity-100"
								alt="supprimer l'image" />
						</button>

					</div>
					<input type="hidden" th:field="*{mediaUUID}" />
					<input type="hidden" name="removeImage" id="removeImage" value="false">
				</div>
				<input id="memoryId" th:field="*{memoryId}" type="hidden" />
				<div class="publish flex items-center gap-2">
					<input type="checkbox" th:field="*{published}" th:checked="*{published}" class="form-checkbox" />
					<label for="publish" class="form-label mb-0 cursor-pointer">Publier</label>
				</div>
				<div>
					<div class="location-input flex flex-row gap-3 items-center">
						<input type="hidden" id="locationSelected" th:field="*{locationSelected}" />
						<button id="openModalBtn" type="button" class="form-button"
							th:text="${memoryForm.memoryId == 0 ?'Choisir un lieu':'Modifier le lieu'}"></button>
						<div id="locationStatus"
							class="text-sm text-ink-soft flex flex-col justify-center items-center">
							<th:block th:if="${memoryForm.locationSelected}">
								Position définie<br>
								<span th:text="*{latitude} + ', ' + *{longitude}"></span>
							</th:block>
						</div>
					</div>
					<input id="latitude" th:field="*{latitude}" type="hidden" readonly />
					<input id="longitude" th:field="*{longitude}" type="hidden" readonly />
					<div th:replace="~{fragments/errors/fragment-error :: frag-error(locationSelected)}"></div>
				</div>
			</div>

			<div class="buttons-container flex flex-col sm:flex-row gap-3 justify-center">
				<button type="submit" class="button create form-button"
					th:text="${memoryForm.memoryId == 0 ? 'Créer' : 'Modifier'}"></button>
				<a th:href="${memoryForm.memoryId == 0} ? @{/} : @{/memory/{id} (id=${memoryForm.memoryId})}"
					class="button cancel inline-flex items-center justify-center my-2 px-4 py-2 font-semibold rounded
					border-2 border-olive text-olive hover:bg-sage-soft
					focus-visible:outline-none focus-visible:ring-3 focus-visible:ring-offset-2 focus-visible:ring-offset-paper focus-visible:ring-ink">Annuler</a>
			</div>
		</form>

		<div id="upload-status" class="hidden mt-4 p-3 bg-olive text-paper rounded flex items-center space-x-2">
			<div class="w-4 h-4 border-2 border-paper border-t-transparent rounded-full animate-spin"></div>
			<span>Redimensionnement de l'image en cours...</span>
		</div>
	</main>

	<aside id="modal" class="fixed inset-0 flex items-center justify-center hidden z-40" role="dialog" aria-modal="true"
		aria-labelledby="title-modal">
		<div class="overlay absolute w-full h-full bg-ink/40 js-close-modal"></div>
		<div
			class="w-11/12 min-w-xs h-9/10 min-h-[300px] p-7 bg-paper-light border-2 border-olive rounded-lg absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
			<button aria-label="Fermer la fenêtre"
				class="js-close-modal px-2 py-1 rounded text-lg absolute top-2.5 right-2.5 bg-ink text-paper font-black hover:bg-olive
				focus-visible:outline-none focus-visible:ring-3 focus-visible:ring-offset-2 focus-visible:ring-offset-paper focus-visible:ring-ink">X</button>
			<h2 id="title-modal" class="h2-title"
				th:text="${memoryForm.memoryId == 0 ? 'Choisissez un lieu pour votre souvenir' : 'Modifier le lieu de votre souvenir'}">
			</h2>
			<div id="map" class="h-9/10 w-9/10 mb-4 mx-auto border-2 border-olive rounded"></div>
			<p id="southWest"></p>
			<p id="northEast"></p>
			<button id="validateLocation" class="form-button">Valider</button>
		</div>
	</aside>

	<div th:replace="~{fragments/fragment-footer :: footer}"></div>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://cdn.jsdelivr.net/npm/pica@9.0.1/dist/pica.min.js"></script>
	<script src="/js/map-modal.js" type="module"></script>
	<script src="/js/images.js"></script>
	<script src="/js/sources.js"></script>
</body>

</html>
