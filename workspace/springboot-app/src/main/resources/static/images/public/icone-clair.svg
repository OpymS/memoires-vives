<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Mémoires vives — icône (palette du site)
       Un souvenir déposé (le point) dont l'écho se propage,
       irrégulier, comme un souvenir qui se transmet de proche en proche. -->
  <circle cx="100" cy="100" r="78"
          fill="none" stroke="#7e9076" stroke-width="4"
          stroke-linecap="round"
          stroke-dasharray="205 90" stroke-dashoffset="40"
          opacity="0.35"/>
  <circle cx="100" cy="100" r="58"
          fill="none" stroke="#7e9076" stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="230 134" stroke-dashoffset="260"
          opacity="0.7"/>
  <circle cx="100" cy="100" r="38"
          fill="none" stroke="#7e9076" stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="180 58" stroke-dashoffset="120"/>
  <circle cx="100" cy="100" r="14" fill="#bddab2"/>
</svg>
