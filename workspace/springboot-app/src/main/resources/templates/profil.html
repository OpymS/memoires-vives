<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/fragment-head :: head(
	'Profil de ' + ${userToDisplay.pseudo} + ' | Mémoires vives',
	'Profil public de ' + ${userToDisplay.pseudo} + ', membre de la communauté Mémoires vives dédiée aux souvenirs locaux.',
	'index, follow',
	@{https://memoires-vives.fr/profil?userId={id}(id=${userToDisplay.userId})},
	~{}
)}">
</head>

<body class="min-h-screen flex flex-col bg-paper">
	<div th:replace="~{fragments/fragment-header :: header}"></div>

	<main class="w-full flex-grow flex flex-col items-center">
		<h1 class="h1-title">Profil de <span th:text="${userToDisplay.pseudo}"></span></h1>

		<div class="w-full md:w-4/5 max-w-4xl flex flex-col items-center gap-6 mt-2 mb-10">
			<div
				class="bg-paper-light border-2 border-olive rounded-lg p-6 flex flex-col items-center gap-3 w-full max-w-xs">
				<img class="rounded-full w-32 h-32 object-cover border-4 border-olive"
					th:if="${userToDisplay.mediaUUID}!=null"
					th:src="@{/uploads/{filename}(filename=${userToDisplay.mediaUUID})}"
					th:alt="'image de profil de ' + ${userToDisplay.pseudo}" />
				<img class="rounded-full w-32 h-32 object-cover border-4 border-olive bg-sage-soft"
					th:if="${userToDisplay.mediaUUID}==null" src="/images/public/user-placeholder.png"
					th:alt="${userToDisplay.pseudo} + ' n\'a pas d\'image de profil'" />

				<p class="font-serif text-lg font-bold text-ink" th:text="${userToDisplay.pseudo}"></p>

				<p th:if="${isOwner}" class="text-sm text-ink-soft" th:text="${userToDisplay.email}"></p>

				<a th:if="${isOwner}" th:href="@{/profil/modify}" class="form-button w-full text-center">Modifier mon
					profil</a>
			</div>

			<section class="w-full flex flex-col items-center gap-4">
				<h2 class="font-serif text-olive text-xl font-semibold border-b-2 border-line pb-2 w-full text-center">
					Souvenirs partagés par <span th:text="${userToDisplay.pseudo}"></span>
				</h2>

				<div th:if="${views != null and !views.empty}"
					class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-5 w-full">

					<a th:each="view : ${views}"
						th:if="${view.memory.state.name() == 'PUBLISHED' or (view.memory.state.name() == 'CREATED' and isOwner)}"
						th:href="@{${view.canonicalUrl}}" class="memory-card" th:object="${view.memory}">

						<div
							class="relative w-full h-36 bg-sage-soft flex items-center justify-center overflow-hidden border-b-2 border-line">
							<div th:if="*{state.name() == 'CREATED'}"
								class="absolute top-3 -left-9 w-36 -rotate-45 bg-olive text-paper text-xs font-bold text-center py-1 border-y-2 border-ink z-10">
								Brouillon</div>
							<img class="max-w-full max-h-full object-contain" th:src="${view.memory.mediaUUID != null
									? '/uploads/' + view.memory.mediaUUID
									: '/images/public/memory-placeholder.png'}" th:alt="${view.memory.mediaUUID != null
									? 'illustration de ' + view.memory.title
									: 'souvenir sans illustration'}" loading="lazy" />
						</div>

						<div class="flex flex-col gap-1 p-3">
							<span class="tag" th:if="*{category != null}"
								th:text="*{category.name}">Catégorie</span>
							<h3 class="font-serif text-base font-bold text-ink" th:text="*{title}">Titre du souvenir
							</h3>
						</div>
					</a>
				</div>

				<p th:if="${views == null or views.empty}" class="text-ink-soft italic">
					Aucun souvenir à afficher
				</p>
			</section>
			<!--				<div th:if="${userToDisplay.friends != null}">-->
			<!--					<div th:each="friend : ${userToDisplay.friends}">-->
			<!--						<a th:href="@{/profil(userId=${friend.userId})}" th:text="${friend.pseudo}"></a>-->
			<!--					</div>					-->
			<!--				</div>-->
			<!--				<div th:if="${userToDisplay.friends != null}">-->
			<!--					Aucun ami à afficher-->
			<!--				</div>-->
		</div>
	</main>
	<div th:replace="~{fragments/fragment-footer :: footer}"></div>
</body>

</html>
