<div th:fragment="modal">
	<div id="groupModal"
		class="fixed inset-0 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">

		<!-- overlay -->
		<div id="modalOverlay" class="absolute inset-0 bg-black/60 opacity-0 transition-opacity duration-300"
			onclick="closeGroupModal()"></div>

		<!-- modal -->
		<div id="modalContent"
			class="relative w-full max-w-2xl mx-4 p-6 rounded-2xl bg-white shadow-xl opacity-0 scale-95 translate-y-4 transition-all duration-300">
			<h3 id="modalTitle" class="text-2xl font-bold"></h3>
			<p id="modalDescription" class="mt-2 text-gray-600"></p>
			<div class="mt-6 space-y-4 text-sm">
				<div>
					<h4 class="font-semibold">Âge</h4>
					<p id="modalAge"></p>
				</div>

				<div>
					<h4 class="font-semibold">Niveau</h4>
					<p id="modalLevel"></p>
				</div>

				<div>
					<h4 class="font-semibold">Objectifs</h4>
					<ul id="modalObjectives" class="list-disc pl-5 text-gray-700"></ul>
				</div>

				<div>
					<h4 class="font-semibold">Horaires</h4>
					<div id="modalSchedule" class="mt-2 flex flex-wrap gap-2"></div>
				</div>

			</div>
			<div class="mt-6 flex justify-end">
				<button onclick="closeGroupModal()" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">
					Fermer
				</button>
			</div>
		</div>
	</div>
</div>
