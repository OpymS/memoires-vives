<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/fragment-head :: head(
	'Partagez la mémoire locale de votre région - ' + ${country} + '| Mémoires vives',
	'Découvrez et partagez des souvenirs locaux de ' + ${country},
	'index, follow',
	${canonicalUrl},
	~{fragments/fragment-extra-head::geoMemHead}
)}">
</head>

<body id="body" th:data-authenticated="${#authentication.principal != 'anonymousUser'}" data-page="geographical"
	class="min-h-screen flex flex-col bg-paper">
	<div th:replace="~{fragments/fragment-header :: header}"></div>
	<main class="w-full flex-grow flex flex-col items-center">
		<nav class="w-full md:w-4/5 flex justify-start mt-4" aria-label="fil d'Ariane">
			<ol class="flex flex-wrap items-center text-sm text-ink-soft">
				<li class="flex items-center">
					<a th:href="@{/}"
						class="text-olive font-semibold hover:underline focus-visible:underline focus-visible:outline-none">Accueil</a>
				</li>
				<li class="flex items-center">
					<span class="mx-2 text-line">/</span>
					<a th:href="@{/memories/{countrySlug} (countrySlug=${countrySlug})}" th:text="${country}"
						class="text-olive font-semibold hover:underline focus-visible:underline focus-visible:outline-none"></a>
				</li>
				<li class="flex items-center" th:unless="${city == null}">
					<span class="mx-2 text-line">/</span>
					<span th:text="${city}" class="text-ink"></span>
				</li>
			</ol>
		</nav>
		<h1 class="h1-title">Souvenirs de <span th:unless="${city == null}" th:text="${city} + ' - '"></span><span
				th:text="${country}"></span></h1>
		<input type="hidden" id="country-input" th:value="${countrySlug}" />
		<input type="hidden" id="city-input" th:value="${citySlug}" />
		<div th:replace="~{fragments/fragment-filters-container :: filters-container(false)}"></div>

		<div th:replace="~{fragments/fragment-memory-grid :: memory-grid}"></div>
	</main>
	<div th:replace="~{fragments/fragment-footer :: footer}"></div>

	<script src="/js/find-and-sort.js"></script>
</body>

</html>
