<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Nouvelle demande de contact SRACN</title>
</head>

<body style="margin:0;padding:0;background-color:#f6faf8;font-family:Arial,sans-serif;">

	<div style="max-width:600px;margin:0 auto;background:#ffffff;padding:24px;border-radius:12px;">

		<!-- HEADER -->
		<div style="text-align:center;padding-bottom:16px;border-bottom:1px solid #eee;">
			<h2 style="margin:0;color:#1F5C45;">SRACN</h2>
			<p style="margin:4px 0 0;color:#667085;font-size:14px;">
				Nouvelle demande de contact
			</p>
		</div>

		<!-- INFOS PERSONNE -->
		<div style="padding:16px 0;">
			<h3 style="color:#1D2939;margin-bottom:12px;">Coordonnées</h3>

			<p style="margin:4px 0;">
				<strong>Nom :</strong>
				<span th:text="${prenom} + ' ' + ${nom}"></span>
			</p>

			<p style="margin:4px 0;">
				<strong>Email :</strong>
				<a th:href="'mailto:' + ${email}" style="color:#32AF7D;text-decoration:none;">
					<span th:text="${email}"></span>					
				</a>
			</p>

			<p style="margin:4px 0;">
				<strong>Téléphone :</strong>
				<span th:text="${telephone}"></span>
			</p>
		</div>

		<!-- SUJET -->
		<div style="padding:16px 0;border-top:1px solid #eee;">
			<h3 style="color:#1D2939;margin-bottom:12px;">Sujet</h3>

			<p style="margin:0;color:#32AF7D;font-weight:bold;" th:text="${subject}">
			</p>
		</div>

		<!-- MESSAGE -->
		<div style="padding:16px 0;border-top:1px solid #eee;">
			<h3 style="color:#1D2939;margin-bottom:12px;">Message</h3>

			<div style="white-space:pre-line;color:#344054;" th:text="${message}">
			</div>
		</div>

		<!-- FOOTER -->
		<div style="padding-top:16px;border-top:1px solid #eee;text-align:center;font-size:12px;color:#667085;">
			Email envoyé depuis le site SRACN
		</div>

	</div>

</body>

</html>
