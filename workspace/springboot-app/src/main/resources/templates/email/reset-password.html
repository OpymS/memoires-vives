<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Réinitialisation de votre mot de passe utilisateur</title>
</head>

<body style="margin:0; padding:0; font-family: Georgia, 'Times New Roman', serif; background-color:#efead9;">
	<table width="100%" cellpadding="0" cellspacing="0" border="0">
		<tr>
			<td align="center" style="padding: 30px 15px;">
				<table width="100%" cellpadding="0" cellspacing="0" border="0"
					style="max-width:600px; background-color:#fbf9f0; border:2px solid #7e9076; border-top:6px solid #7e9076; border-radius:8px;">

					<tr>
						<td align="center" style="padding: 25px 40px 10px;">
							<span
								style="font-family: Georgia, 'Times New Roman', serif; font-size:20px; font-weight:bold; color:#7e9076;">
								Mémoires vives
							</span>
						</td>
					</tr>

					<tr>
						<td style="padding: 0 40px;">
							<hr style="border:none; border-top:1px solid #c9c2a8; margin:0;">
						</td>
					</tr>

					<tr>
						<td align="center" style="padding: 25px 40px 0;">
							<h2 th:text="'Bonjour ' + ${name} + ' !'"
								style="margin:0; font-size:24px; color:#2b3324; font-family: Georgia, 'Times New Roman', serif;">
								Bonjour, utilisateur !
							</h2>
						</td>
					</tr>

					<tr>
						<td align="center"
							style="padding: 20px 40px 30px; font-size:16px; color:#5a6350; font-family: Arial, sans-serif;">
							<p style="margin:0;">Cliquez sur le lien ci-dessous pour réinitialiser votre mot de passe
							</p>
						</td>
					</tr>

					<tr>
						<td align="center" style="padding-bottom:30px;">
							<a th:href="${resetLink}"
								style="background-color:#7e9076; color:#fbf9f0; padding:12px 28px; text-decoration:none; border:2px solid #2b3324; border-radius:4px; display:inline-block; font-weight:bold; font-family: Arial, sans-serif; font-size:16px;">
								Réinitialiser le mot de passe
							</a>
						</td>
					</tr>

					<tr>
						<td align="center"
							style="padding: 0 40px 30px; font-size:13px; color:#5a6350; font-family: Arial, sans-serif;">
							<p th:text="'Ce lien expire le ' + ${date} + ' à ' + ${heure}" style="margin:0;">
								Ce lien expire dans 30 minutes.
							</p>
						</td>
					</tr>

				</table>
			</td>
		</tr>
	</table>
</body>

</html>
